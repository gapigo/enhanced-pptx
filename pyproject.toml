[project]
name = "kinea-pptx-plus"
version = "0.0.1"
requires-python = ">=3.11"
description = "Extensão de python-pptx para reproduzir gráficos no nível ThinkCell — manipulação XML direta + overlay de shapes"
license = {text = "MIT"}
dependencies = [
    "python-pptx-ng>=0.7.0",
    "lxml>=4.9",
    "pandas>=1.5",
    "Pillow>=9.0",
    "pytesseract>=0.3",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8", "pytest-xdist", "black", "ruff", "mypy", "pre-commit"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
